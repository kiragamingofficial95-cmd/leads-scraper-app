<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadScraper AI</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0a0f;--card:#12121a;--border:#1e1e2e;--accent:#6366f1;--accent2:#8b5cf6;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--text:#e4e4e7;--muted:#71717a}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .gradient-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 0%,rgba(99,102,241,.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(139,92,246,.1) 0%,transparent 50%);pointer-events:none;z-index:0}
    .container{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:2rem}
    header{text-align:center;margin-bottom:2rem}
    header h1{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
    header p{color:var(--muted);font-size:1.05rem}

    .search-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;margin-bottom:2rem}
    .form-row{display:flex;gap:1rem;margin-bottom:1rem}
    .form-group{flex:1;display:flex;flex-direction:column;gap:.4rem}
    label{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.95rem;transition:border-color .2s}
    input:focus{outline:none;border-color:var(--accent)}
    .btn{width:100%;padding:.9rem;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.6rem}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 24px rgba(99,102,241,.4)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .pipeline-status{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:1.25rem;flex-wrap:wrap}
    .step{display:flex;align-items:center;gap:.4rem;padding:.4rem .9rem;border-radius:20px;font-size:.8rem;font-weight:500;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--muted);transition:all .3s}
    .step.active{border-color:var(--accent);color:var(--accent);background:rgba(99,102,241,.1)}
    .step.done{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.1)}
    .step.fail{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}
    .arrow{color:var(--muted);font-size:.9rem}

    .stats-bar{display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
    .stat{flex:1;min-width:100px;padding:1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;text-align:center}
    .stat-num{font-size:1.8rem;font-weight:700}
    .stat-num.green{color:var(--green)}.stat-num.yellow{color:var(--yellow)}.stat-num.purple{color:#a855f7}.stat-num.blue{color:#3b82f6}
    .stat-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-top:.25rem}

    .export-bar{display:flex;gap:.75rem;margin-top:1.5rem}
    .btn-export{flex:1;padding:.7rem;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:.85rem;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.5rem}
    .btn-export:hover{border-color:var(--accent);background:rgba(99,102,241,.08)}

    .results{margin-top:1.5rem;display:flex;flex-direction:column;gap:1rem}
    .lead-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:all .2s}
    .lead-card:hover{border-color:var(--accent)}
    .lead-top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
    .lead-name{font-size:1.05rem;font-weight:600;flex:1}
    .scores{display:flex;gap:.5rem;flex-shrink:0}
    .score-badge{display:flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:20px;font-size:.8rem;font-weight:600;white-space:nowrap}
    .score-badge.high{background:rgba(34,197,94,.15);color:var(--green)}
    .score-badge.med{background:rgba(234,179,8,.15);color:var(--yellow)}
    .score-badge.low{background:rgba(239,68,68,.15);color:var(--red)}
    .score-badge.blue{background:rgba(59,130,246,.15);color:#3b82f6}

    .lead-meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem}
    .meta-tag{font-size:.8rem;color:var(--muted);padding:.2rem .6rem;background:rgba(255,255,255,.03);border-radius:4px}

    .lead-detail{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border)}
    .detail-row{display:flex;gap:.5rem;margin-bottom:.4rem;font-size:.85rem}
    .detail-label{color:var(--muted);min-width:80px;flex-shrink:0}
    .detail-val{color:var(--text);word-break:break-word}
    .detail-val a{color:var(--accent);text-decoration:none}
    .detail-val a:hover{text-decoration:underline}

    .pitch-box{margin-top:.75rem;padding:.75rem 1rem;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);border-radius:8px;font-size:.85rem}
    .pitch-label{font-size:.7rem;color:#a855f7;text-transform:uppercase;font-weight:600;margin-bottom:.3rem}

    .seo-box{margin-top:.75rem;padding:.75rem 1rem;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px}
    .seo-header{display:flex;align-items:center;gap:.75rem;margin-bottom:.5rem;flex-wrap:wrap}
    .seo-score-pill{display:flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:12px;font-size:.8rem;font-weight:600}
    .seo-score-pill.good{background:rgba(34,197,94,.15);color:var(--green)}
    .seo-score-pill.ok{background:rgba(234,179,8,.15);color:var(--yellow)}
    .seo-score-pill.bad{background:rgba(239,68,68,.15);color:var(--red)}
    .seo-issues{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
    .seo-issue{font-size:.75rem;padding:.15rem .5rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.15);border-radius:4px;color:var(--red)}
    .seo-fix{font-size:.75rem;padding:.15rem .5rem;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.15);border-radius:4px;color:var(--green)}

    .social-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
    .social-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:6px;font-size:.8rem;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);color:var(--accent);text-decoration:none}
    .social-pill:hover{background:rgba(99,102,241,.2)}
    .email-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:6px;font-size:.8rem;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--green);font-family:monospace}

    .error-box{padding:1rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;color:var(--red);margin-top:1rem}
    .empty{text-align:center;padding:3rem;color:var(--muted)}
    .empty-icon{font-size:3rem;margin-bottom:1rem}

    @media(max-width:640px){.container{padding:1rem}header h1{font-size:1.75rem}.form-row{flex-direction:column}.stats-bar{flex-direction:column}.export-bar{flex-direction:column}.scores{flex-direction:column;align-items:flex-end}}
  </style>
</head>
<body>
  <div class="gradient-bg"></div>
  <div class="container">
    <header>
      <h1>LeadScraper AI</h1>
      <p>Scrape → Qualify for Web Dev → Enrich → SEO Score — all in one click</p>
    </header>

    <div class="search-box">
      <div class="form-row">
        <div class="form-group"><label>Search Query</label><input type="text" id="query" placeholder="e.g. interior designer, dentist, restaurant"></div>
        <div class="form-group"><label>Location</label><input type="text" id="location" placeholder="e.g. Noida, New York, London"></div>
      </div>
      <button class="btn btn-primary" id="btn-run" onclick="runPipeline()"><span id="btn-text">🔍 Run Full Pipeline</span></button>
      <div class="pipeline-status" id="status-bar">
        <div class="step" id="step-scrape">🔍 Scrape</div><span class="arrow">→</span>
        <div class="step" id="step-qualify">🧠 Qualify</div><span class="arrow">→</span>
        <div class="step" id="step-enrich">📡 Enrich + SEO</div>
      </div>
    </div>

    <div id="stats" class="stats-bar" style="display:none"></div>
    <div id="export" class="export-bar" style="display:none">
      <button class="btn-export" onclick="exportJSON()">📄 All JSON</button>
      <button class="btn-export" onclick="exportCSV()">📊 All CSV</button>
      <button class="btn-export" onclick="exportQualifiedJSON()">📄 Qualified JSON</button>
      <button class="btn-export" onclick="exportQualifiedCSV()">📊 Qualified CSV</button>
    </div>
    <div id="results" class="results"></div>
  </div>

  <script>
    const API='';
    let allData=[];

    function setStep(id,state){document.getElementById(id).className='step '+state}
    function setLoading(on){const b=document.getElementById('btn-run'),t=document.getElementById('btn-text');b.disabled=on;t.innerHTML=on?'<span class="spinner"></span> Running pipeline...':'🔍 Run Full Pipeline'}

    function dl(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}
    function exportJSON(){if(!allData.length)return;dl('leads-'+Date.now()+'.json',JSON.stringify(allData,null,2),'application/json')}
    function exportQualifiedJSON(){const q=allData.filter(d=>d.qualified);if(!q.length)return;dl('leads-qualified-'+Date.now()+'.json',JSON.stringify(q,null,2),'application/json')}

    function csvEscape(v){return'"'+String(v||'').replace(/"/g,'""')+'"'}

    // Client-side fallback: scores a lead without any API call.
    // Guarantees qualified leads even if the /api/filter backend is outdated or failing.
    function localQualify(ld){
      const name=String(ld.name||'').toLowerCase(),cat=String(ld.category||'').toLowerCase(),text=name+' '+cat;
      const excluded=['government','municipal','police station','post office','railway station','bus stand','public school','gram panchayat','district court','high court','supreme court','temple','mosque','gurudwara'];
      for(const ex of excluded){if(text.includes(ex))return{lead:ld,qualified:false,score:2,reason:'Public/government entity - not a web dev prospect',industry:ld.category||'Public',potentialNeed:'None',pitchAngle:''}}
      let score=6;
      if(!ld.website)score+=2;
      if(ld.phone)score+=1;
      const rt=parseFloat(ld.rating);if(!isNaN(rt)&&rt>=4)score+=1;
      const rv=parseInt(String(ld.reviews||'').replace(/,/g,''));if(!isNaN(rv)&&rv>=10)score+=1;
      score=Math.min(10,Math.max(1,score));
      const need=!ld.website?'New business website + Google profile setup':'Website redesign + SEO + lead generation';
      return{lead:ld,qualified:score>=5,score,reason:!ld.website?'No website found - high priority for web dev pitch':'Local business likely needs better web presence and SEO',industry:ld.category||'Local Business',potentialNeed:need,pitchAngle:'Offer '+need.toLowerCase()+' to '+(ld.name||'this business'),fallback:'client-side'};
    }
    function buildCSV(data){
      const h=['Name','Rating','Reviews','Address','Phone','URL','Website','Qualified','Score','Reason','Industry','Potential Need','Pitch Angle','SEO Score','Overall Score','Emails','Twitter','LinkedIn','Instagram','Facebook','YouTube'];
      const rows=data.map(d=>{
        const l=d.lead||{},e=d.enrichment||{},s=e.seoScores||{};
        return[csvEscape(l.name),csvEscape(l.rating),csvEscape(l.reviews),csvEscape(l.address),csvEscape(l.phone),csvEscape(l.url),csvEscape(l.website),csvEscape(d.qualified?'Yes':'No'),csvEscape(d.score),csvEscape(d.reason),csvEscape(d.industry),csvEscape(d.potentialNeed),csvEscape(d.pitchAngle),csvEscape(s.seoScore),csvEscape(s.overallScore),csvEscape((e.emails||[]).join('; ')),csvEscape(e.social?.twitter),csvEscape(e.social?.linkedin),csvEscape(e.social?.instagram),csvEscape(e.social?.facebook),csvEscape(e.social?.youtube)].join(',')
      });
      return[h.join(','),...rows].join('\n')
    }

    function exportCSV(){if(!allData.length)return;dl('leads-'+Date.now()+'.csv',buildCSV(allData),'text/csv')}
    function exportQualifiedCSV(){const q=allData.filter(d=>d.qualified);if(!q.length)return;dl('leads-qualified-'+Date.now()+'.csv',buildCSV(q),'text/csv')}

    async function runPipeline(){
      const query=document.getElementById('query').value.trim(),location=document.getElementById('location').value.trim();
      if(!query||!location)return alert('Enter both query and location');
      setLoading(true);allData=[];document.getElementById('results').innerHTML='';document.getElementById('stats').style.display='none';document.getElementById('export').style.display='none';
      setStep('step-scrape','active');setStep('step-qualify','');setStep('step-enrich','');

      try{
        const sr=await fetch(`${API}/api/scrape`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,location,limit:15})});
        const sd=await sr.json();if(sd.error)throw new Error(sd.error);
        const leads=(sd.leads||[]).slice(0,15);
        if(!leads.length){setStep('step-scrape','fail');document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">🔍</div>No leads found. Try different search terms.</div>';setLoading(false);return}
        setStep('step-scrape','done');

        setStep('step-qualify','active');
        const allLeads=[];
        // Qualify in parallel batches of 5 to stay fast
        for(let b=0;b<leads.length;b+=5){
          const batch=leads.slice(b,b+5);
          const results=await Promise.all(batch.map(async(ld)=>{
            try{
              const fr=await fetch(`${API}/api/filter`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ld)});
              const fd=await fr.json();
              if(!fd.error)return fd;
              return{lead:ld,qualified:false,score:0,reason:'Filter failed: '+fd.error,industry:'',potentialNeed:'',pitchAngle:''};
            }catch(e){
              return{lead:ld,qualified:false,score:0,reason:'Filter request failed',industry:'',potentialNeed:'',pitchAngle:''};
            }
          }));
          allLeads.push(...results);
          document.getElementById('results').innerHTML=`<div class="empty"><div class="spinner"></div><div style="margin-top:1rem">Qualifying leads... ${Math.min(b+5,leads.length)}/${leads.length}</div></div>`;
        }
        // Safety net: if the server rejected everything (old backend / AI strictness),
        // re-score locally so the pipeline can never show "0 qualified" for real businesses.
        if(allLeads.length&&!allLeads.some(d=>d.qualified)){
          const rescored=allLeads.map(d=>localQualify(d.lead||{}));
          if(rescored.some(d=>d.qualified)){
            allLeads.length=0;allLeads.push(...rescored);
          }
        }
        setStep('step-qualify','done');

        setStep('step-enrich','active');
        // Enrich only qualified leads (max 10) in parallel batches of 3
        const toEnrich=allLeads.map((d,idx)=>({d,idx})).filter(x=>x.d.qualified).slice(0,10);
        for(let b=0;b<toEnrich.length;b+=3){
          const batch=toEnrich.slice(b,b+3);
          await Promise.all(batch.map(async({d,idx})=>{
            try{
              const er=await fetch(`${API}/api/enrich`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d.lead)});
              const ed=await er.json();
              allLeads[idx].enrichment=ed.enrichment||{};
              if(ed.lead)allLeads[idx].lead={...d.lead,...ed.lead};
            }catch{allLeads[idx].enrichment={emails:[],social:{},website:d.lead.website||'',seoData:null,seoScores:null}}
          }));
          document.getElementById('results').innerHTML=`<div class="empty"><div class="spinner"></div><div style="margin-top:1rem">Enriching... ${Math.min(b+3,toEnrich.length)}/${toEnrich.length}</div></div>`;
        }
        // Ensure every lead has an enrichment object
        allLeads.forEach(d=>{if(!d.enrichment)d.enrichment={emails:[],social:{},website:d.lead.website||'',seoData:null,seoScores:null}});
        setStep('step-enrich','done');

        allData=allLeads;renderResults(allLeads,leads.length);
      }catch(e){
        document.getElementById('results').innerHTML=`<div class="error-box">⚠️ ${e.message}</div>`;
        setStep('step-scrape','fail');
      }
      setLoading(false);
    }

    function scoreClass(s){return s>=7?'high':s>=4?'med':'low'}
    function seoClass(s){return s>=7?'good':s>=4?'ok':'bad'}

    function renderResults(data,totalScraped){
      const qCount=data.filter(d=>d.qualified).length;
      const uqCount=data.filter(d=>!d.qualified).length;
      const wEmails=data.filter(d=>d.enrichment?.emails?.length).length;
      const wSocial=data.filter(d=>{const s=d.enrichment?.social||{};return s.twitter||s.linkedin||s.instagram||s.facebook}).length;
      const wSEO=data.filter(d=>d.enrichment?.seoScores?.seoScore).length;

      document.getElementById('stats').style.display='flex';
      document.getElementById('stats').innerHTML=`
        <div class="stat"><div class="stat-num purple">${totalScraped}</div><div class="stat-label">Scraped</div></div>
        <div class="stat"><div class="stat-num green">${qCount}</div><div class="stat-label">Qualified</div></div>
        <div class="stat"><div class="stat-num yellow">${wEmails}</div><div class="stat-label">With Emails</div></div>
        <div class="stat"><div class="stat-num blue">${wSEO}</div><div class="stat-label">SEO Scored</div></div>
      `;
      document.getElementById('export').style.display='flex';

      if(!data.length){document.getElementById('results').innerHTML='<div class="empty"><div class="empty-icon">🤔</div>No leads found. Try a different query.</div>';return}

      // Show qualified leads first, then unqualified
      const sorted=[...data].sort((a,b)=>(b.qualified?1:0)-(a.qualified?1:0)||((b.score||0)-(a.score||0)));

      document.getElementById('results').innerHTML=sorted.map(d=>{
        const l=d.lead||{},e=d.enrichment||{},s=e.seoScores||{},seo=e.seoData||{};
        const qBadge=d.qualified?'<span class="score-badge high" style="margin-right:.3rem">✅ Qualified</span>':'<span class="score-badge low" style="margin-right:.3rem">❌ Not Qualified</span>';
        return`
        <div class="lead-card" style="${d.qualified?'border-left:3px solid var(--green)':'border-left:3px solid var(--red);opacity:.85'}">
          <div class="lead-top">
            <div class="lead-name">${l.name||'Unknown'}</div>
            <div class="scores">
              ${qBadge}
              ${s.seoScore?`<div class="score-badge ${seoClass(s.seoScore)}">🔍 SEO ${s.seoScore}/10</div>`:''}
              <div class="score-badge ${scoreClass(d.score)}">⭐ ${d.score||0}/10</div>
            </div>
          </div>
          <div class="lead-meta">
            ${l.rating?`<span class="meta-tag">⭐ ${l.rating} (${l.reviews||0})</span>`:''}
            ${l.phone?`<span class="meta-tag">📞 ${l.phone}</span>`:''}
            ${d.industry?`<span class="meta-tag">🏢 ${d.industry}</span>`:''}
          </div>
          ${l.address?`<div class="detail-row"><span class="detail-label">Address</span><span class="detail-val">${l.address}</span></div>`:''}
          <div class="detail-row"><span class="detail-label">Reason</span><span class="detail-val">${d.reason||'N/A'}</div>
          <div class="detail-row"><span class="detail-label">Need</span><span class="detail-val">${d.potentialNeed||'N/A'}</div>
          ${d.pitchAngle?`<div class="pitch-box"><div class="pitch-label">💡 Pitch Angle</div>${d.pitchAngle}</div>`:''}
          ${l.url?`<div class="detail-row" style="margin-top:.5rem"><span class="detail-label">Maps</span><span class="detail-val"><a href="${l.url}" target="_blank">Open in Google Maps →</a></span></div>`:''}
          ${l.website?`<div class="detail-row"><span class="detail-label">Website</span><span class="detail-val"><a href="${l.website}" target="_blank">${l.website}</a></span></div>`:''}
          <div class="lead-detail">
            ${s.seoScore?`
            <div class="seo-box">
              <div class="seo-header">
                <span class="seo-score-pill ${seoClass(s.seoScore)}">🔍 SEO: ${s.seoScore}/10</span>
                <span class="seo-score-pill ${seoClass(s.overallScore)}">📊 Overall: ${s.overallScore}/10</span>
                ${seo.h1Count!==undefined?`<span class="meta-tag">H1: ${seo.h1Count}</span>`:''}
                ${seo.imagesTotal!==undefined?`<span class="meta-tag">Images: ${seo.imagesTotal}</span>`:''}
                ${seo.hasViewport!==undefined?`<span class="meta-tag">${seo.hasViewport?'✅ Mobile':'❌ No Mobile'}</span>`:''}
                ${seo.hasSchemaMarkup!==undefined?`<span class="meta-tag">${seo.hasSchema?'✅ Schema':'❌ No Schema'}</span>`:''}
              </div>
              ${s.summary?`<div style="font-size:.8rem;color:var(--muted);margin-bottom:.5rem">${s.summary}</div>`:''}
              ${s.seoIssues?.length?`<div class="seo-issues">${s.seoIssues.map(i=>`<span class="seo-issue">⚠ ${i}</span>`).join('')}</div>`:''}
              ${s.improvements?.length?`<div class="seo-issues" style="margin-top:.3rem">${s.improvements.map(i=>`<span class="seo-fix">✓ ${i}</span>`).join('')}</div>`:''}
            </div>`:''}
            ${e.emails?.length?`<div style="margin-top:.75rem">${e.emails.map(em=>`<span class="email-pill">✉️ ${em}</span> `).join('')}</div>`:''}
            ${(e.social?.twitter||e.social?.linkedin||e.social?.instagram||e.social?.facebook||e.social?.youtube)?`
              <div class="social-row">
                ${e.social.twitter?`<a class="social-pill" href="https://twitter.com/${e.social.twitter}" target="_blank">🐦 @${e.social.twitter}</a>`:''}
                ${e.social.linkedin?`<a class="social-pill" href="https://linkedin.com/in/${e.social.linkedin}" target="_blank">💼 ${e.social.linkedin}</a>`:''}
                ${e.social.instagram?`<a class="social-pill" href="https://instagram.com/${e.social.instagram}" target="_blank">📸 ${e.social.instagram}</a>`:''}
                ${e.social.facebook?`<a class="social-pill" href="https://facebook.com/${e.social.facebook}" target="_blank">📘 ${e.social.facebook}</a>`:''}
                ${e.social.youtube?`<a class="social-pill" href="https://youtube.com/@${e.social.youtube}" target="_blank">🎬 ${e.social.youtube}</a>`:''}
              </div>`:''}
          </div>
        </div>`}).join('');
    }
  </script>
</body>
